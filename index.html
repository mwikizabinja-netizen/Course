<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon jeu de course</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#222222">
<link rel="icon" href="icon-192.png">
<style>
  body { margin: 0; background: #222; display: flex; justify-content: center; }
  canvas { background: #444; touch-action: none; max-width: 100%; }
</style>
</head>
<body>
<canvas id="jeu" width="320" height="480"></canvas>
<script>
const c = document.getElementById('jeu');
const ctx = c.getContext('2d');
let voiture = { x: 140, y: 400, l: 40, h: 60 };
let obstacles = [];
let score = 0;
let fini = false;

function deplacer(clientX) {
  const r = c.getBoundingClientRect();
  const x = (clientX - r.left) * (c.width / r.width);
  voiture.x = Math.max(0, Math.min(c.width - voiture.l, x - voiture.l / 2));
}
c.addEventListener('touchmove', e => { deplacer(e.touches[0].clientX); e.preventDefault(); }, { passive: false });
c.addEventListener('touchstart', e => { if (fini) recommencer(); else deplacer(e.touches[0].clientX); });
c.addEventListener('mousemove', e => deplacer(e.clientX));
c.addEventListener('click', () => { if (fini) recommencer(); });

function recommencer() {
  obstacles = []; score = 0; fini = false;
}

function boucle() {
  ctx.clearRect(0, 0, c.width, c.height);
  if (!fini) {
    if (Math.random() < 0.03) {
      obstacles.push({ x: Math.random() * (c.width - 40), y: -40, l: 40, h: 40 });
    }
    obstacles.forEach(o => o.y += 3 + score / 500);
    obstacles = obstacles.filter(o => o.y < c.height);
    score++;
    for (const o of obstacles) {
      if (voiture.x < o.x + o.l && voiture.x + voiture.l > o.x &&
          voiture.y < o.y + o.h && voiture.y + voiture.h > o.y) fini = true;
    }
  }
  ctx.fillStyle = 'red';
  ctx.fillRect(voiture.x, voiture.y, voiture.l, voiture.h);
  ctx.fillStyle = 'yellow';
  obstacles.forEach(o => ctx.fillRect(o.x, o.y, o.l, o.h));
  ctx.fillStyle = 'white';
  ctx.font = '20px sans-serif';
  ctx.fillText('Score : ' + Math.floor(score / 10), 10, 28);
  if (fini) {
    ctx.fillText('Perdu ! Touche pour rejouer', 40, 240);
  }
  requestAnimationFrame(boucle);
}
boucle();
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
</script>
</body>
</html>
